# Identity owns the remaining public API paths.
location /api/ {
    proxy_pass http://identity-api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host identity-api;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location = /api/users/me/exchange-key {
    limit_req zone=sensitive_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://identity-api:8000/users/me/exchange-key;
    proxy_http_version 1.1;
    proxy_set_header Host identity-api;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location = /api/users/me/password {
    limit_req zone=sensitive_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://identity-api:8000/users/me/password;
    proxy_http_version 1.1;

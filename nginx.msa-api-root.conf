# Dedicated API hostname routes: /* -> the service that owns the capability.
location = /internal {
    return 404;
}

location ^~ /internal/ {
    return 404;
}

location ~ ^/(auth|users)(/|$) {
    proxy_pass http://identity-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host identity-api;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location = /strategies/positions {
    proxy_pass http://portfolio-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host portfolio-api;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location ~ ^/strategies/(executions|liquidate-all|[0-9]+/manual-sell)$ {

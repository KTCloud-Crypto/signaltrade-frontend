name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t signaltrade-frontend:ci .
      - name: Smoke test container health
        run: |
          docker run -d --name signaltrade-frontend-ci -p 8080:80 \
            --add-host identity-api:127.0.0.1 \
            --add-host strategy-api:127.0.0.1 \
            --add-host trading-api:127.0.0.1 \
            --add-host portfolio-api:127.0.0.1 \
            signaltrade-frontend:ci
          trap 'docker logs signaltrade-frontend-ci; docker rm -f signaltrade-frontend-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  deploy-staging:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::832496385575:role/signaltrade-staging-github-frontend-deploy
          aws-region: us-east-1
      - name: Upload immutable static assets
        run: |
          aws s3 sync dist/ s3://signaltrade-frontend-frontendbucket-sdmkvcs0tbsn/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
      - name: Upload entry point without browser cache
        run: |
          aws s3 cp dist/index.html s3://signaltrade-frontend-frontendbucket-sdmkvcs0tbsn/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3F0440D4AYZSS --paths "/*"
